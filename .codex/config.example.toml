personality = "pragmatic"
model = "gpt-5.3-codex"
model_reasoning_effort = "high"

[mcp_servers.taruvi]
url = "https://site.taruvi.cloud/mcp/"
Accept = "application/json, text/event-stream"
Authorization = "Api-Key "
X-App-Slug = "project-management"

[mcp_servers.taruvi.tools.create_update_schema]
approval_mode = "approve"

[mcp_servers.taruvi.tools.get_datatable_schema]
approval_mode = "approve"

[mcp_servers.taruvi.tools.execute_raw_sql]
approval_mode = "approve"

[mcp_servers.taruvi.tools.datatable_data]
approval_mode = "approve"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
env_vars = ["CONTEXT7_API_KEY"]

[mcp_servers.chrome-devtools]
command = "npx"
args = ["chrome-devtools-mcp@latest"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
